name: backend-console-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - name: Build Windows x64 package
        working-directory: tools/backend-console
        run: |
          uv sync --python 3.12 --frozen
          uv run --python 3.12 python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: RoomManagementBackendConsole-windows-x64
          path: |
            tools/backend-console/dist/*.zip
            tools/backend-console/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
