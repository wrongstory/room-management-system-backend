name: backend-console-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - name: Build Windows x64 package
        working-directory: tools/backend-console
        run: |
          uv sync --python 3.12 --frozen
          uv run --python 3.12 python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: RoomManagementBackendConsole-windows-x64
          path: |
            tools/backend-console/dist/*.zip
            tools/backend-console/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
