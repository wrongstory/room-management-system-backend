name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run edge:check
      - run: npm run ci:quality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1 libgl1
      - run: python -m pip install uv==0.11.32
      - name: Verify Python backend console
        working-directory: tools/backend-console
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --python 3.12 --frozen
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          uv run --python 3.12 mypy src tests scripts
          uv run --python 3.12 pytest
          uv run --python 3.12 python scripts/check_business_openapi_codegen.py
          uv run --python 3.12 python scripts/build.py --check-only

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:start:ci
      - run: npm run db:verify
      - run: npm run db:test
      - run: npm run db:test:concurrency
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
