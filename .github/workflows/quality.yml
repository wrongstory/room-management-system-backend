name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run edge:check
      - run: npm run ci:quality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.32
      - name: Verify Python backend console
        working-directory: tools/backend-console
        run: |
          uv sync --python 3.12 --frozen
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          uv run --python 3.12 mypy src tests scripts
          uv run --python 3.12 pytest
          uv run --python 3.12 python scripts/build.py --check-only

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start:ci
      - run: npm run db:verify
      - run: npm run db:test
      - run: npm run db:test:concurrency
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
